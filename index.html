<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pixel Jump</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}

body{
background:#111;
overflow:hidden;
touch-action:none;
}

canvas{
background:linear-gradient(#7ec0ff,#dff6ff);
display:block;
}

.btn{
position:fixed;
bottom:20px;
width:70px;
height:70px;
background:#000a;
color:white;
font-size:35px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
}

#right{right:20px}
#jump{right:100px}

#gameOver{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000d;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
font-size:30px;
}

#retry{
margin-top:20px;
padding:15px 30px;
font-size:20px;
display:none;
}

#imgMorte{
width:200px;
pointer-events:none;
}
</style>
</head>

<body oncontextmenu="return false">

<canvas id="game"></canvas>

<div id="right" class="btn">➡️</div>
<div id="jump" class="btn">⬆️</div>

<div id="gameOver">
<img id="imgMorte" src="morte.png">
<button id="retry">Jogar Novamente</button>
</div>

<audio id="som" src="musica.mp3"></audio>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

function resize(){
canvas.width=window.innerWidth
canvas.height=window.innerHeight
}
resize()
window.onresize=resize

let player={
x:100,
y:300,
w:40,
h:40,
dy:0
}

let andando=false
let pulando=false
let morreu=false

let gravidade=0.8
let forcaPulo=-17

let obstaculos=[]
let velocidade=5
let dificuldade=1
let intervalo=1700

const som=document.getElementById("som")

function desenharPlayer(){

ctx.fillStyle="#ffcc00"
ctx.fillRect(player.x,player.y,player.w,player.h)

ctx.fillStyle="#000"
ctx.fillRect(player.x+10,player.y+10,5,5)
ctx.fillRect(player.x+25,player.y+10,5,5)

}

function criarObstaculo(){

let altura=40+(dificuldade*5)

obstaculos.push({
x:canvas.width,
y:canvas.height-altura-80,
w:40,
h:altura,
passou:false
})

}

function gerarLoop(){
setTimeout(()=>{
if(!morreu){
criarObstaculo()
gerarLoop()
}
},intervalo)
}
gerarLoop()

function colisao(a,b){
return a.x<a.x+b.w &&
a.x+a.w>b.x &&
a.y<a.y+b.h &&
a.y+a.h>b.y
}

function morrer(){

morreu=true

som.currentTime=0
som.play()

document.getElementById("gameOver").style.display="flex"

setTimeout(()=>{
document.getElementById("retry").style.display="block"
},2000)

}

document.getElementById("retry").onclick=()=>{

som.pause()
som.currentTime=0

morreu=false
player.y=300
obstaculos=[]
velocidade=5
dificuldade=1
intervalo=1700

document.getElementById("gameOver").style.display="none"
document.getElementById("retry").style.display="none"

}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

if(andando && !morreu){
player.x+=velocidade
}

player.dy+=gravidade
player.y+=player.dy

if(player.y>canvas.height-80){
player.y=canvas.height-80
player.dy=0
pulando=false
}

if(player.x<0)player.x=0
if(player.x>canvas.width-50)player.x=canvas.width-50

desenharPlayer()

obstaculos.forEach(o=>{

o.x-=velocidade

ctx.fillStyle="red"
ctx.fillRect(o.x,o.y,o.w,o.h)

if(!o.passou && o.x+o.w<player.x){
o.passou=true
dificuldade+=0.2
velocidade+=0.3
if(intervalo>700)intervalo-=80
}

if(
player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y &&
!morreu
){
morrer()
}

})

requestAnimationFrame(loop)
}

loop()

document.getElementById("right").ontouchstart=()=>andando=true
document.getElementById("right").ontouchend=()=>andando=false

document.getElementById("jump").ontouchstart=()=>{
if(!pulando){
player.dy=forcaPulo
pulando=true
}
}

window.onkeydown=e=>{
if(e.key=="ArrowRight"||e.key=="d")andando=true
if(e.key=="ArrowUp"||e.key=="w"){
if(!pulando){
player.dy=forcaPulo
pulando=true
}
}
}

window.onkeyup=e=>{
if(e.key=="ArrowRight"||e.key=="d")andando=false
}

</script>
</body>
</html>
