<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Runner - Jogo em Código</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #6b5b95;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background-color: #87ceeb; /* Céu */
  }
  #menu {
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background-color: rgba(0,0,0,0.8);
    z-index:10;
  }
  #menu h1 {
    color:#fff;
    font-size:2em;
    margin-bottom:20px;
  }
  #menu button {
    padding:10px 20px;
    margin:5px;
    font-size:1em;
    cursor:pointer;
  }
  #fase {
    position:absolute;
    top:10px; left:10px;
    color:#fff;
    font-weight:bold;
    font-size:1.2em;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Pixel Runner</h1>
  <button id="startBtn">Jogar</button>
</div>
<div id="fase">Fase: 1</div>
<audio id="audioGame" src="musica.mp3" loop></audio>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const audio = document.getElementById('audioGame');

let gameRunning = false;
let fase = 1;
const totalFases = 20;
let obstacles = [];
let gameSpeed = 3;
let score = 0;

// Personagem
const player = {
  x:50,
  y:300,
  width:32,
  height:32,
  vy:0,
  gravity:0.8,
  jumpForce:-12,
  onGround:false,
  color:'#ffdd59'
};

// Obstáculos
class Obstacle{
  constructor(x,y,width,height){
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
  }
  draw(){
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
}

// Iniciar jogo
function startGame(){
  document.getElementById('menu').style.display = 'none';
  gameRunning = true;
  obstacles = [];
  fase = 1;
  score = 0;
  gameSpeed = 3;
  audio.currentTime = 0;
  audio.play();
  generateObstacles();
  requestAnimationFrame(gameLoop);
}

// Gerar obstáculos
function generateObstacles(){
  obstacles = [];
  let count = 5 + fase; // aumenta dificuldade por fase
  for(let i=0;i<count;i++){
    let obsHeight = Math.random() * 40 + 20;
    let obsX = 400 + i*150 + Math.random()*100;
    let obsY = canvas.height - obsHeight - 50;
    let obsWidth = 20 + Math.random()*20;
    obstacles.push(new Obstacle(obsX, obsY, obsWidth, obsHeight));
  }
}

// Reiniciar jogo
function resetGame(){
  player.y = 300;
  player.vy = 0;
  player.onGround = false;
  score = 0;
  gameSpeed = 3;
  fase = 1;
  generateObstacles();
  audio.pause();
  audio.currentTime = 0;
  document.getElementById('menu').style.display = 'flex';
}

// Controles
document.addEventListener('keydown',(e)=>{
  if(e.code === 'Space' || e.code === 'ArrowUp'){
    if(player.onGround){
      player.vy = player.jumpForce;
      player.onGround = false;
    }
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);

// Loop do jogo
function gameLoop(){
  if(!gameRunning) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Fundo
  ctx.fillStyle = '#87ceeb'; // Céu
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#2ecc71'; // chão
  ctx.fillRect(0,350,canvas.width,50);

  // Player
  player.vy += player.gravity;
  player.y += player.vy;
  if(player.y + player.height > 350){
    player.y = 350 - player.height;
    player.vy = 0;
    player.onGround = true;
  }
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Obstáculos
  obstacles.forEach(obs=>{
    obs.x -= gameSpeed;
    obs.draw();

    // colisão
    if(player.x < obs.x + obs.width &&
       player.x + player.width > obs.x &&
       player.y < obs.y + obs.height &&
       player.y + player.height > obs.y){
         audio.pause(); // parar música
         alert('Você bateu! Reinicie o jogo.');
         resetGame();
    }
  });

  // Pontuação e fase
  score++;
  if(score > 800){
    if(fase < totalFases){
      fase++;
      gameSpeed += 0.5;
      generateObstacles();
      score = 0;
    } else {
      alert('Parabéns! Você completou todas as fases!');
      resetGame();
    }
  }
  document.getElementById('fase').innerText = 'Fase: ' + fase;

  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
