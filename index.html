<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Pular Blocos</title>
<style>
  body, html {
    margin:0; padding:0; height:100%; font-family: sans-serif; display:flex; justify-content:center; align-items:center; background: linear-gradient(to top, #87ceeb, #ffffff);
  }
  #game-container {
    position: relative; width: 400px; height: 500px; background:#f7f7f7; overflow:hidden; border-radius:15px; border:3px solid #333;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  }
  .player {
    position: absolute; bottom:0; left:50px; width:50px; height:50px; background:#ff3e3e; border-radius:10px; transition: bottom 0.2s;
  }
  .obstacle {
    position: absolute; bottom:0; width:50px; height:50px; background:#333; right:-50px; border-radius:5px;
  }
  #gameover-screen {
    display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); color:#fff; text-align:center; padding-top:50px;
  }
  #gameover-screen img { max-width:70%; margin-top:20px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.5);}
  #score {
    position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:1.5em; font-weight:bold; color:#333;
  }
  button {
    padding:10px 20px; margin:10px 5px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; background:#1f4e79; color:#fff; transition:0.3s;
  }
  button:hover { background:#16395a; }
</style>
</head>
<body>

<div id="game-container">
  <div id="score">0</div>
  <div class="player" id="player"></div>
  <div id="gameover-screen">
    <h1>Game Over!</h1>
    <img src="gameover.png" alt="Game Over">
    <div>
      <button onclick="restartGame()">Jogar de Novo</button>
      <button onclick="stopAudio()">Parar Som</button>
    </div>
  </div>
</div>

<audio id="game-audio" src="musica.mp3"></audio>

<script>
const player = document.getElementById('player');
const container = document.getElementById('game-container');
const gameOverScreen = document.getElementById('gameover-screen');
const audio = document.getElementById('game-audio');
const scoreDisplay = document.getElementById('score');

let jumping = false;
let obstacles = [];
let gameInterval;
let speed = 3;
let score = 0;

function jump() {
  if(jumping) return;
  jumping = true;
  let bottom = parseInt(player.style.bottom) || 0;
  let up = setInterval(()=>{
    if(bottom >= 120){ clearInterval(up); let down = setInterval(()=>{ if(bottom <= 0){ clearInterval(down); jumping=false;} bottom-=5; player.style.bottom=bottom+'px';},20);} 
    bottom+=5; player.style.bottom=bottom+'px';
  },20);
}

// controles teclado e toque
document.addEventListener('keydown', e => { if(e.code==='Space') jump(); });
document.addEventListener('touchstart', jump);

function createObstacle() {
  let obs = document.createElement('div');
  obs.classList.add('obstacle');
  container.appendChild(obs);
  let right = -50;
  let move = setInterval(()=>{
    right += speed;
    obs.style.right = right+'px';

    // colisão
    let pRect = player.getBoundingClientRect();
    let oRect = obs.getBoundingClientRect();
    if(!(pRect.top>oRect.bottom || pRect.bottom<oRect.top || pRect.right<oRect.left || pRect.left>oRect.right)){
      gameOver();
    }

    if(right > 400){ clearInterval(move); obs.remove(); score+=1; scoreDisplay.innerText=score; }
  },20);
  obstacles.push(obs);
}

function gameOver() {
  clearInterval(gameInterval);
  obstacles.forEach(o=>o.remove());
  obstacles=[];
  gameOverScreen.style.display='block';
  audio.play();
}

function restartGame() {
  gameOverScreen.style.display='none';
  speed=3;
  score=0;
  scoreDisplay.innerText=score;
  setTimeout(()=>{
    gameInterval = setInterval(()=>{
      createObstacle();
      speed += 0.05; // dificuldade crescente
    },2000);
  },2500); // delay de 2,5 segundos antes de começar
}

function stopAudio(){
  audio.pause();
  audio.currentTime=0;
}

// inicia automaticamente
restartGame();
</script>

</body>
</html>
