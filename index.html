<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
margin:0;
overflow:hidden;
touch-action:none;
user-select:none;
background:#87ceeb;
}

canvas{
display:block;
}

.btn{
position:fixed;
bottom:20px;
width:80px;
height:80px;
background:#0008;
color:white;
font-size:40px;
text-align:center;
line-height:80px;
border-radius:50%;
z-index:10;
}

#jump{left:20px;}
#right{right:20px;}
#pause{
left:50%;
transform:translateX(-50%);
}

#gameOver{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
background:#000a;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:20;
}

#retry{
display:none;
padding:20px;
font-size:25px;
}

img{
width:200px;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="jump" class="btn">⬆️</div>
<div id="right" class="btn">➡️</div>
<div id="pause" class="btn">⏸️</div>

<div id="gameOver">
<img src="https://i.imgur.com/5QF6N7H.png">
<button id="retry">Jogar de novo</button>
</div>

<audio id="som" src="musica.mp3"></audio>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let ground=canvas.height-100

let score=0
let level=1

let andando=false
let pulando=false
let morreu=false
let pausado=false

let player={
x:100,
y:ground-40,
w:40,
h:40,
dy:0
}

let gravidade=0.9
let pulo=-18

let obstaculos=[]
let velocidade=5
let intervalo=1500

const som=document.getElementById("som")

function criarObs(){

let altura=40+level*3

obstaculos.push({
x:canvas.width,
y:ground-altura,
w:40,
h:altura,
passou:false
})

}

function spawn(){

if(morreu||pausado)return

criarObs()

setTimeout(spawn,intervalo)

}

spawn()

function morrer(){

if(morreu)return

morreu=true

som.pause()
som.currentTime=0
som.play()

gameOver.style.display="flex"

setTimeout(()=>{
retry.style.display="block"
},2000)

}

retry.onclick=()=>{

som.pause()

morreu=false
pausado=false
andando=false

obstaculos=[]

player.x=100
player.y=ground-player.h

gameOver.style.display="none"
retry.style.display="none"

spawn()

}

pause.onclick=()=>{

pausado=!pausado

if(pausado){
pause.innerHTML="▶️"
som.pause()
}else{
pause.innerHTML="⏸️"
}

}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

if(andando && !morreu && !pausado){
player.x+=velocidade
}

if(player.x<0)player.x=0
if(player.x>canvas.width-player.w)player.x=canvas.width-player.w

player.dy+=gravidade
player.y+=player.dy

if(player.y>ground-player.h){
player.y=ground-player.h
player.dy=0
pulando=false
}

ctx.fillStyle="yellow"
ctx.fillRect(player.x,player.y,player.w,player.h)

obstaculos.forEach(o=>{

if(!pausado)o.x-=velocidade

ctx.fillStyle="red"
ctx.fillRect(o.x,o.y,o.w,o.h)

if(
player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y &&
!morreu
){
morrer()
}

if(!o.passou && o.x+o.w<player.x){
o.passou=true
score++

if(score%5==0){
level++
velocidade+=1
intervalo-=150
if(intervalo<500)intervalo=500
}
}

})

ctx.fillStyle="black"
ctx.font="20px Arial"
ctx.fillText("Pontos: "+score,20,40)
ctx.fillText("Nivel: "+level,20,70)

requestAnimationFrame(loop)
}

loop()

jump.ontouchstart=()=>{
if(!pulando && !pausado){
player.dy=pulo
pulando=true
}
}

right.ontouchstart=()=>andando=true
right.ontouchend=()=>andando=false

onkeydown=e=>{
if(e.key=="ArrowRight")andando=true
if(e.key=="ArrowUp"){
if(!pulando){
player.dy=pulo
pulando=true
}
}
}

onkeyup=e=>{
if(e.key=="ArrowRight")andando=false
}

</script>

</body>
</html>
