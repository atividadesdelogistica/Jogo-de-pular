<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jogo</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
user-select:none;
}

canvas{
background:#111;
display:block;
}

#gameOverImg{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:200px;
display:none;
z-index:5;
pointer-events:none;
}

#pauseBtn{
position:fixed;
top:20px;
right:20px;
width:60px;
height:60px;
font-size:25px;
border-radius:50%;
background:#ffcc00;
z-index:10;
}
</style>
</head>

<body>

<button id="pauseBtn">⏸️</button>

<img id="gameOverImg" src="morte.png">

<audio id="deathSound" src="morte.mp3"></audio>

<canvas id="game"></canvas>

<script>

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let GROUND=canvas.height-80

let player={
x:50,
y:GROUND-40,
w:40,
h:40,
vy:0
}

let gravity=0.8
let pulando=false
let andando=true
let morreu=false
let pausado=false

let obstaculos=[]
let score=0
let record=localStorage.getItem("record")||0
let speed=6

function pular(){
if(!pulando && !morreu && !pausado){
player.vy=-15
pulando=true
}
}

document.addEventListener("touchstart",pular)
document.addEventListener("keydown",e=>{
if(e.code=="Space")pular()
if(e.key=="Escape" && !morreu){
pausado=!pausado
pauseBtn.innerText=pausado?"▶️":"⏸️"
}
})

pauseBtn.onclick=()=>{
if(!morreu){
pausado=!pausado
pauseBtn.innerText=pausado?"▶️":"⏸️"
}
}

function criarObstaculo(){
if(!morreu){
obstaculos.push({
x:canvas.width,
y:GROUND-40,
w:30,
h:40,
passou:false
})
}
}

setInterval(criarObstaculo,1500)

function morrer(){

morreu=true

if(score>record){
record=score
localStorage.setItem("record",record)
}

document.getElementById("gameOverImg").style.display="block"

let som=document.getElementById("deathSound")
som.currentTime=0
som.play()

setTimeout(()=>{
resetar()
},3000)
}

function resetar(){

morreu=false
score=0
speed=6
obstaculos=[]
player.y=GROUND-40
player.vy=0
document.getElementById("gameOverImg").style.display="none"
}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

if(andando && !morreu && !pausado){

player.vy+=gravity
player.y+=player.vy

if(player.y>GROUND-40){
player.y=GROUND-40
player.vy=0
pulando=false
}

obstaculos.forEach(o=>{

o.x-=speed

if(!o.passou && o.x+o.w<player.x){
o.passou=true
score++
if(score%5==0)speed+=1
}

if(
player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y
){
morrer()
}

ctx.fillStyle="red"
ctx.fillRect(o.x,o.y,o.w,o.h)

})

}

ctx.fillStyle="#00ffcc"
ctx.fillRect(player.x,player.y,player.w,player.h)

ctx.fillStyle="white"
ctx.font="20px Arial"
ctx.fillText("Pontos:"+score,20,40)
ctx.fillText("Record:"+record,20,70)

if(morreu){
ctx.font="50px Arial"
ctx.fillText("MORTE",canvas.width/2-100,canvas.height/2-100)
}

if(pausado){
ctx.font="40px Arial"
ctx.fillText("PAUSADO",canvas.width/2-100,canvas.height/2)
}

requestAnimationFrame(loop)
}

loop()

</script>
</body>
</html>
