<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<style>

body{
margin:0;
overflow:hidden;
background:#111;
touch-action:none;
}

canvas{
display:block;
background:linear-gradient(#6ec6ff,#e0f7ff);
}

.btn{
position:fixed;
bottom:25px;
width:70px;
height:70px;
background:#000a;
color:white;
font-size:35px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
}

#jump{left:20px}
#right{right:20px}

#gameOver{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000c;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
}

#retry{
display:none;
margin-top:20px;
padding:15px 30px;
font-size:20px;
}

img{pointer-events:none}

</style>
</head>

<body oncontextmenu="return false">

<canvas id="game"></canvas>

<div id="jump" class="btn">⬆️</div>
<div id="right" class="btn">➡️</div>

<div id="gameOver">
<img src="morte.png" width="200">
<button id="retry">Jogar novamente</button>
</div>

<audio id="som" src="musica.mp3"></audio>

<script>

const canvas=game
const ctx=canvas.getContext("2d")

function resize(){
canvas.width=innerWidth
canvas.height=innerHeight
ground=canvas.height-100
}
resize()
onresize=resize

let ground

let player={
x:100,
y:0,
w:40,
h:40,
dy:0
}

let andando=false
let pulando=false
let morreu=false

let gravidade=0.9
let pulo=-18

let obstaculos=[]
let velocidade=5
let dificuldade=1
let intervalo=1500

const som=document.getElementById("som")

function criarObs(){

let altura=40

obstaculos.push({
x:canvas.width,
y:ground-altura,
w:40,
h:altura,
passou:false
})

}

function spawn(){
setTimeout(()=>{
if(!morreu){
criarObs()
spawn()
}
},intervalo)
}
spawn()

function morrer(){

morreu=true
som.currentTime=0
som.play()

gameOver.style.display="flex"

setTimeout(()=>{
retry.style.display="block"
},2000)

}

retry.onclick=()=>{
som.pause()
som.currentTime=0

morreu=false
player.y=ground-player.h
obstaculos=[]
velocidade=5
dificuldade=1
intervalo=1500

gameOver.style.display="none"
retry.style.display="none"
}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

if(andando && !morreu){
player.x+=velocidade
}

player.dy+=gravidade
player.y+=player.dy

if(player.y>ground-player.h){
player.y=ground-player.h
player.dy=0
pulando=false
}

if(player.x<0)player.x=0
if(player.x>canvas.width-player.w)player.x=canvas.width-player.w

ctx.fillStyle="#ffcc00"
ctx.fillRect(player.x,player.y,player.w,player.h)

obstaculos.forEach(o=>{

o.x-=velocidade

ctx.fillStyle="red"
ctx.fillRect(o.x,o.y,o.w,o.h)

if(!o.passou && o.x+o.w<player.x){
o.passou=true
dificuldade+=0.2
velocidade+=0.3
if(intervalo>700)intervalo-=80
}

if(
player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y &&
!morreu
){
morrer()
}

})

requestAnimationFrame(loop)
}

player.y=ground-player.h
loop()

right.ontouchstart=()=>andando=true
right.ontouchend=()=>andando=false

jump.ontouchstart=()=>{
if(!pulando){
player.dy=pulo
pulando=true
}
}

onkeydown=e=>{
if(e.key=="ArrowRight"||e.key=="d")andando=true
if(e.key=="ArrowUp"||e.key=="w"){
if(!pulando){
player.dy=pulo
pulando=true
}
}
}

onkeyup=e=>{
if(e.key=="ArrowRight"||e.key=="d")andando=false
}

</script>
</body>
</html>
