<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jogo</title>
<link rel="stylesheet" href="style.css">
</head>

<body oncontextmenu="return false">

<div id="game">

<div id="player"></div>
<div id="obstacle"></div>

<div id="score">0</div>
<div id="record">REC: 0</div>

<button id="pauseBtn">⏸️</button>

<div id="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️</button>
<button id="right">➡️</button>
</div>

<div id="gameOver">
<img src="morte.png" id="deathImg">
<br>
<button id="restart">Jogar Novamente</button>
</div>

</div>

<audio id="deathSound" src="musica.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
