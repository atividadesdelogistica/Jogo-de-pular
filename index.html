<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Jump Game</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #222;
    font-family: monospace;
    user-select: none;
    touch-action: none;
  }

  canvas {
    display: block;
    margin: 0 auto;
    background-color: #87CEEB; /* céu inicial */
  }

  #touchControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 1000;
  }

  .touch-btn {
    width: 60px;
    height: 60px;
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
    text-align: center;
    line-height: 60px;
    font-size: 24px;
    color: #fff;
    user-select: none;
  }

  #gameOverScreen {
    position: absolute;
    top: 0;
    left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    display: none;
    z-index: 1001;
  }

  #gameOverScreen img {
    width: 200px;
    margin-bottom: 20px;
  }

  #restartBtn {
    padding: 10px 20px;
    font-size: 20px;
    background-color: #1f4e79;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
  }

  #restartBtn:hover {
    background-color: #16395a;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="320"></canvas>

<div id="touchControls">
  <div class="touch-btn" id="leftBtn">◀</div>
  <div class="touch-btn" id="jumpBtn">▲</div>
  <div class="touch-btn" id="rightBtn">▶</div>
</div>

<div id="gameOverScreen">
  <img src="/mnt/data/A_pixel_art_digital_illustration_features_a_cheerf.png" alt="Game Over">
  <div>Você morreu!</div>
  <button id="restartBtn">Jogar de novo</button>
</div>

<audio id="deathSound" src="musica.mp3"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameWidth = canvas.width;
let gameHeight = canvas.height;

let player = {
  x: 50,
  y: gameHeight - 40,
  width: 30,
  height: 30,
  color: '#FF0000',
  dy: 0,
  jumping: false,
  speed: 2
};

let gravity = 0.5;
let obstacles = [];
let obstacleSpeed = 2;
let frameCount = 0;
let gameOver = false;
let currentPhase = 1;

// Teclado e toque
let keys = { left:false, right:false, jump:false };
const isTouch = 'ontouchstart' in window;

// Criar obstáculos
function spawnObstacle(){
  const height = Math.floor(Math.random()*20)+20;
  obstacles.push({
    x: gameWidth,
    y: gameHeight - height,
    width: 20,
    height: height,
    color: '#000'
  });
}

// Reset do jogo
function resetGame(){
  player.x = 50;
  player.y = gameHeight - 40;
  player.dy = 0;
  player.jumping = false;
  obstacles = [];
  frameCount = 0;
  gameOver = false;
  currentPhase = 1;
  obstacleSpeed = 2;
  document.getElementById('gameOverScreen').style.display = 'none';
}

// Game Over
function triggerGameOver(){
  gameOver = true;
  const deathSound = document.getElementById('deathSound');
  deathSound.currentTime = 0;
  deathSound.play();
  setTimeout(()=>{ document.getElementById('gameOverScreen').style.display = 'flex'; }, 2000);
}

// Loop do jogo
function gameLoop(){
  ctx.clearRect(0,0,gameWidth,gameHeight);

  // Fundo pixelado por fase
  if(currentPhase===1) ctx.fillStyle = '#87CEEB';
  else if(currentPhase===2) ctx.fillStyle = '#90EE90';
  else if(currentPhase===3) ctx.fillStyle = '#FFD700';
  else ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0,0,gameWidth,gameHeight);

  // Player
  if(keys.left) player.x -= player.speed;
  if(keys.right) player.x += player.speed;
  if(keys.jump && !player.jumping){
    player.dy = -8;
    player.jumping = true;
  }
  player.dy += gravity;
  player.y += player.dy;

  if(player.y + player.height >= gameHeight){
    player.y = gameHeight - player.height;
    player.jumping = false;
    player.dy = 0;
  }

  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Obstáculos
  frameCount++;
  if(frameCount % 120 === 0){
    spawnObstacle();
  }

  for(let i=0;i<obstacles.length;i++){
    let obs = obstacles[i];
    obs.x -= obstacleSpeed;
    ctx.fillStyle = obs.color;
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

    // Colisão
    if(player.x < obs.x + obs.width &&
       player.x + player.width > obs.x &&
       player.y < obs.y + obs.height &&
       player.y + player.height > obs.y){
         triggerGameOver();
    }
  }

  // Remove obstáculos passados
  obstacles = obstacles.filter(o=>o.x+o.width>0);

  if(!gameOver) requestAnimationFrame(gameLoop);
}

// Controles teclado
document.addEventListener('keydown', (e)=>{
  if(e.code==='ArrowLeft') keys.left=true;
  if(e.code==='ArrowRight') keys.right=true;
  if(e.code==='ArrowUp') keys.jump=true;
});

document.addEventListener('keyup', (e)=>{
  if(e.code==='ArrowLeft') keys.left=false;
  if(e.code==='ArrowRight') keys.right=false;
  if(e.code==='ArrowUp') keys.jump=false;
});

// Controles touch
if(isTouch){
  document.getElementById('leftBtn').addEventListener('touchstart', ()=> keys.left=true);
  document.getElementById('leftBtn').addEventListener('touchend', ()=> keys.left=false);
  document.getElementById('rightBtn').addEventListener('touchstart', ()=> keys.right=true);
  document.getElementById('rightBtn').addEventListener('touchend', ()=> keys.right=false);
  document.getElementById('jumpBtn').addEventListener('touchstart', ()=> keys.jump=true);
  document.getElementById('jumpBtn').addEventListener('touchend', ()=> keys.jump=false);
}

// Restart
document.getElementById('restartBtn').addEventListener('click', ()=>{
  resetGame();
  gameLoop();
});

// Inicia o jogo
gameLoop();

</script>

</body>
</html>
