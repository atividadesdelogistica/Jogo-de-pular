<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Jump</title>

<style>
body{
margin:0;
overflow:hidden;
background:#111;
font-family:Arial;
}

canvas{
background:#87CEEB;
display:block;
}

#controls{
position:fixed;
bottom:20px;
left:20px;
z-index:10;
}

.btn{
width:70px;
height:70px;
font-size:30px;
margin:5px;
border-radius:15px;
border:none;
background:#333;
color:white;
}

#gameOver{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
}

#restart{
margin-top:20px;
padding:10px 20px;
font-size:20px;
display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="controls">
<button class="btn" id="right">➡️</button>
<button class="btn" id="jump">⬆️</button>
</div>

<div id="gameOver">
<h1>GAME OVER</h1>
<canvas id="dead" width="100" height="100"></canvas>
<button id="restart">Jogar de Novo</button>
</div>

<audio id="deathSound" src="musica.mp3"></audio>

<script>
const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")
canvas.width=innerWidth
canvas.height=innerHeight

let player={
x:100,
y:canvas.height-150,
w:40,
h:40,
dy:0,
jump:false,
move:false
}

let gravity=1
let obstacles=[]
let gameOver=false

function createObstacle(){
obstacles.push({
x:canvas.width,
y:canvas.height-80,
w:40,
h:40
})
}

setInterval(createObstacle,2000)

function drawPlayer(){
ctx.fillStyle="red"
ctx.fillRect(player.x,player.y,player.w,player.h)
}

function drawObstacles(){
ctx.fillStyle="green"
obstacles.forEach(o=>{
ctx.fillRect(o.x,o.y,o.w,o.h)
o.x-=5
})
}

function physics(){
if(player.jump){
player.dy=-15
player.jump=false
}
player.dy+=gravity
player.y+=player.dy
if(player.y>canvas.height-150){
player.y=canvas.height-150
player.dy=0
}
}

function collision(){
obstacles.forEach(o=>{
if(player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y){
die()
}
})
}

function die(){
if(gameOver)return
gameOver=true
document.getElementById("gameOver").style.display="flex"

let dead=document.getElementById("dead").getContext("2d")
dead.fillStyle="red"
dead.fillRect(20,20,60,60)

let s=document.getElementById("deathSound")
s.pause()
s.currentTime=0
s.play()

setTimeout(()=>{
document.getElementById("restart").style.display="block"
},2000)
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height)

if(player.move) player.x+=5

drawPlayer()
drawObstacles()
physics()
collision()

if(!gameOver)requestAnimationFrame(loop)
}

loop()

document.getElementById("right").ontouchstart=()=>player.move=true
document.getElementById("right").ontouchend=()=>player.move=false
document.getElementById("jump").ontouchstart=()=>player.jump=true

document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight")player.move=true
if(e.key==="ArrowUp")player.jump=true
})

document.addEventListener("keyup",e=>{
if(e.key==="ArrowRight")player.move=false
})

document.getElementById("restart").onclick=()=>{
location.reload()
}
</script>

</body>
</html>
