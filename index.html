<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Jump Game</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #222;
    font-family: monospace;
    user-select: none;
    touch-action: none;
  }

  canvas {
    display: block;
    margin: 0 auto;
    background-color: #87CEEB; /* Céu inicial */
  }

  #touchControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 1000;
  }

  .touch-btn {
    width: 60px;
    height: 60px;
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
    text-align: center;
    line-height: 60px;
    font-size: 24px;
    color: #fff;
  }

  #gameOverScreen {
    position: absolute;
    top: 0;
    left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    display: none;
    z-index: 1001;
  }

  #gameOverScreen img {
    width: 200px;
    margin-bottom: 20px;
  }

  #restartBtn {
    padding: 10px 20px;
    font-size: 20px;
    background-color: #1f4e79;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    display: none; /* começa oculto */
  }

  #restartBtn:hover {
    background-color: #16395a;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="320"></canvas>

<div id="touchControls">
  <div class="touch-btn" id="forwardBtn">▶</div>
  <div class="touch-btn" id="jumpBtn">▲</div>
</div>

<div id="gameOverScreen">
  <img src="/mnt/data/A_pixel_art_digital_illustration_features_a_cheerf.png" alt="Game Over">
  <div>Você morreu!</div>
  <button id="restartBtn">Jogar de novo</button>
</div>

<audio id="deathSound" src="musica.mp3"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const isTouch = 'ontouchstart' in window;

let gameWidth = canvas.width;
let gameHeight = canvas.height;

let player = {
  x: 50,
  y: gameHeight - 40,
  width: 30,
  height: 30,
  color: '#FF0000',
  dy: 0,
  jumping: false,
  speed: 2
};

let gravity = 0.5;
let obstacles = [];
let obstacleSpeed = 2;
let frameCount = 0;
let gameOver = false;

let keys = { forward:false, jump:false };

function spawnObstacle(){
  const height = Math.floor(Math.random()*30)+20;
  obstacles.push({
    x: gameWidth,
    y: gameHeight - height,
    width: 30,
    height: height,
    color: '#000'
  });
}

function resetGame(){
  player.x = 50;
  player.y = gameHeight - player.height;
  player.dy = 0;
  player.jumping = false;
  obstacles = [];
  frameCount = 0;
  gameOver = false;
  obstacleSpeed = 2;
  const goScreen = document.getElementById('gameOverScreen');
  goScreen.style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
}

function triggerGameOver(){
  if(gameOver) return;
  gameOver = true;

  const deathSound = document.getElementById('deathSound');
  deathSound.currentTime = 0;
  deathSound.play();

  const goScreen = document.getElementById('gameOverScreen');
  goScreen.style.display = 'flex';

  // Mostrar botão após 2 segundos
  setTimeout(()=>{
    document.getElementById('restartBtn').style.display = 'block';
  },2000);
}

function gameLoop(){
  ctx.clearRect(0,0,gameWidth,gameHeight);

  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0,0,gameWidth,gameHeight);

  if(keys.forward && !gameOver) player.x += player.speed;
  if(keys.jump && !player.jumping && !gameOver){
    player.dy = -8;
    player.jumping = true;
  }

  player.dy += gravity;
  player.y += player.dy;

  if(player.y + player.height >= gameHeight){
    player.y = gameHeight - player.height;
    player.jumping = false;
    player.dy = 0;
  }

  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);

  frameCount++;
  if(frameCount % 100 === 0) spawnObstacle();

  for(let i=0;i<obstacles.length;i++){
    let obs = obstacles[i];
    obs.x -= obstacleSpeed;
    ctx.fillStyle = obs.color;
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

    if(player.x < obs.x + obs.width &&
       player.x + player.width > obs.x &&
       player.y < obs.y + obs.height &&
       player.y + player.height > obs.y){
         triggerGameOver();
    }
  }

  obstacles = obstacles.filter(o=>o.x + o.width > 0);

  if(!gameOver) requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e=>{
  if(e.code==='ArrowRight') keys.forward=true;
  if(e.code==='ArrowUp') keys.jump=true;
});
document.addEventListener('keyup', e=>{
  if(e.code==='ArrowRight') keys.forward=false;
  if(e.code==='ArrowUp') keys.jump=false;
});

if(isTouch){
  document.getElementById('forwardBtn').addEventListener('touchstart', ()=> keys.forward=true);
  document.getElementById('forwardBtn').addEventListener('touchend', ()=> keys.forward=false);
  document.getElementById('jumpBtn').addEventListener('touchstart', ()=> keys.jump=true);
  document.getElementById('jumpBtn').addEventListener('touchend', ()=> keys.jump=false);
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  resetGame();
  gameLoop();
});

gameLoop();
</script>
</body>
</html>
