<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Jump</title>

<style>
body{
margin:0;
overflow:hidden;
background:#111;
}

canvas{
background:#1e1e2e;
display:block;
margin:auto;
}

.controls{
position:fixed;
bottom:10px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
}

button{
width:80px;
height:80px;
font-size:30px;
border:none;
border-radius:50%;
background:#444;
color:#fff;
}

#menuMorte{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

#menuMorte img{
width:200px;
}

#voltar{
display:none;
margin-top:20px;
padding:10px 30px;
font-size:20px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="controls">
<button id="andar">➡️</button>
<button id="pular">⬆️</button>
</div>

<div id="menuMorte">
<img src="morte.png">
<button id="voltar">Jogar de Novo</button>
</div>

<audio id="audio" src="musica.mp3"></audio>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let andando = false

let player = {
x:60,
y:canvas.height-120,
w:40,
h:40,
dy:0,
pulando:false
}

let obstaculos=[]

const gravidade=0.6
const forcaPulo=-12
let velocidade=4
let vivo=true

function criarObstaculo(){
obstaculos.push({
x:canvas.width,
y:canvas.height-120,
w:40,
h:40
})
}

setInterval(()=>{
if(vivo)criarObstaculo()
},2000)

function colisao(p,o){
return(
p.x<o.x+o.w &&
p.x+p.w>o.x &&
p.y<o.y+o.h &&
p.y+p.h>o.y
)
}

function desenharPlayer(){
ctx.fillStyle="yellow"
ctx.fillRect(player.x,player.y,player.w,player.h)
}

function desenharObstaculos(){
ctx.fillStyle="red"
obstaculos.forEach(o=>{
ctx.fillRect(o.x,o.y,o.w,o.h)
})
}

function atualizar(){
ctx.clearRect(0,0,canvas.width,canvas.height)

if(andando){
player.x+=velocidade
}

player.dy+=gravidade
player.y+=player.dy

if(player.y>=canvas.height-120){
player.y=canvas.height-120
player.dy=0
player.pulando=false
}

obstaculos.forEach(o=>{
o.x-=velocidade

if(colisao(player,o)){
morrer()
}
})

desenharPlayer()
desenharObstaculos()

if(vivo)requestAnimationFrame(atualizar)
}

function morrer(){
vivo=false
document.getElementById("menuMorte").style.display="flex"
let audio=document.getElementById("audio")
audio.currentTime=0
audio.play()

setTimeout(()=>{
document.getElementById("voltar").style.display="block"
},2000)
}

document.getElementById("voltar").onclick=()=>{
location.reload()
}

document.getElementById("andar").ontouchstart=()=>andando=true
document.getElementById("andar").ontouchend=()=>andando=false

document.getElementById("pular").onclick=()=>{
if(!player.pulando){
player.dy=forcaPulo
player.pulando=true
}
}

document.addEventListener("keydown",(e)=>{
if(e.key==="ArrowRight")andando=true
if(e.key==="ArrowUp"&&!player.pulando){
player.dy=forcaPulo
player.pulando=true
}
})

document.addEventListener("keyup",(e)=>{
if(e.key==="ArrowRight")andando=false
})

atualizar()

</script>
</body>
</html>
