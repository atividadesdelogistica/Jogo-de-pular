<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>

body{
margin:0;
overflow:hidden;
background:#111;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

canvas{
display:block;
background:#222;
}

button,img{
user-select:none;
-webkit-user-select:none;
pointer-events:auto;
}

#setaAndar{
position:fixed;
left:20px;
bottom:20px;
width:70px;
height:70px;
font-size:30px;
border-radius:50%;
background:#00ffcc;
z-index:10;
}

#setaPular{
position:fixed;
right:20px;
bottom:20px;
width:70px;
height:70px;
font-size:30px;
border-radius:50%;
background:#00ffcc;
z-index:10;
}

#pauseBtn{
position:fixed;
top:15px;
right:15px;
width:60px;
z-index:10;
pointer-events:none;
}

#gameOver{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:none;
flex-direction:column;
align-items:center;
z-index:20;
}

#morteImg{
width:220px;
pointer-events:none;
}

#retry{
margin-top:20px;
padding:10px;
font-size:20px;
display:none;
}

</style>
</head>

<body oncontextmenu="return false">

<canvas id="game"></canvas>

<button id="setaAndar">➡️</button>
<button id="setaPular">⬆️</button>

<img id="pauseBtn" src="morte.png">

<div id="gameOver">
<img id="morteImg" src="morte.png">
<button id="retry">Jogar de novo</button>
</div>

<audio id="som" src="musica.mp3"></audio>

<script>

document.addEventListener('copy',e=>e.preventDefault())
document.addEventListener('contextmenu',e=>e.preventDefault())

const c=document.getElementById("game")
const ctx=c.getContext("2d")

c.width=innerWidth
c.height=innerHeight

let x=100
let y=c.height-140
let vy=0
let andando=false
let pulando=false
let morreu=false
let pausado=false

let score=0
let record=localStorage.getItem("record")||0
let velocidade=5
let gravidade=1
let pulo=18

let obstaculos=[]

function criarObstaculo(){
obstaculos.push({
x:c.width,
y:c.height-100,
w:40,
h:60
})
}

setInterval(()=>{
if(!morreu && !pausado)
criarObstaculo()
},2000)

function pular(){
if(!pulando){
vy=-pulo
pulando=true
}
}

function morrer(){
morreu=true
som.currentTime=0
som.play()

gameOver.style.display="flex"

if(score>record){
record=score
localStorage.setItem("record",record)
}

setTimeout(()=>{
retry.style.display="block"
},2000)
}

function loop(){

ctx.clearRect(0,0,c.width,c.height)

if(andando && !morreu && !pausado){

vy+=gravidade
y+=vy

if(y>c.height-140){
y=c.height-140
vy=0
pulando=false
}

obstaculos.forEach(o=>{
o.x-=velocidade

if(
x<o.x+o.w &&
x+40>o.x &&
y<o.y+o.h &&
y+40>o.y
){
morrer()
}

if(o.x+o.w<0){
score++
if(score%5==0) velocidade+=1
}

ctx.fillStyle="red"
ctx.fillRect(o.x,o.y,o.w,o.h)
})

}

ctx.fillStyle="#00ffcc"
ctx.fillRect(x,y,40,40)

ctx.fillStyle="white"
ctx.font="20px Arial"
ctx.fillText("Pontos:"+score,20,40)
ctx.fillText("Record:"+record,20,70)

requestAnimationFrame(loop)
}
loop()

setaAndar.ontouchstart=()=>andando=true
setaAndar.ontouchend=()=>andando=false
setaPular.ontouchstart=()=>pular()

document.onkeydown=e=>{
if(e.key=="ArrowRight") andando=true
if(e.key=="ArrowUp") pular()
}
document.onkeyup=e=>{
if(e.key=="ArrowRight") andando=false
}

retry.onclick=()=>{
som.pause()
som.currentTime=0
score=0
obstaculos=[]
y=c.height-140
morreu=false
retry.style.display="none"
gameOver.style.display="none"
}

</script>
</body>
</html>
