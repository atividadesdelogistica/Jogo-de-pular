<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo</title>
<link rel="stylesheet" href="style.css">
</head>

<body oncontextmenu="return false">

<div id="game">
    <div id="player"></div>
    <div id="obstacle"></div>
</div>

<h2>Pontos: <span id="score">0</span></h2>
<h3>Recorde: <span id="highscore">0</span></h3>

<div id="controls">
    <button id="left">←</button>
    <button id="jump">↑</button>
    <button id="right">→</button>
</div>

<button id="pause">⏸️</button>

<div id="deathScreen">
    <img src="morte.png">
    <button id="restart">Jogar Novamente</button>
</div>

<audio id="deathMusic" src="musica.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
