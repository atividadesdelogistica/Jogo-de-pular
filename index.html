<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

body{
background:black;
overflow:hidden;
touch-action:none;
}

canvas{
background:#1a1a1a;
display:block;
}

.btn{
position:absolute;
bottom:30px;
width:70px;
height:70px;
background:#444;
color:white;
font-size:30px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
z-index:5;
}

#andar{left:20px;}
#pular{right:20px;}

#pause{
position:absolute;
top:10px;
right:10px;
padding:10px;
z-index:10;
}

#morteTela{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;
}

#voltar{
margin-top:20px;
padding:10px;
display:none;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="andar" class="btn">➡️</div>
<div id="pular" class="btn">⬆️</div>
<button id="pause">⏸️</button>

<div id="morteTela">
<img src="morte.png" width="200">
<h2 style="color:white">VOCÊ MORREU</h2>
<button id="voltar">Jogar Novamente</button>
</div>

<audio id="som" src="musica.mp3"></audio>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault())
document.addEventListener("touchstart",e=>e.preventDefault(),{passive:false})
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false})

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

canvas.width=innerWidth
canvas.height=innerHeight

let player={
x:100,
y:canvas.height-100,
w:40,
h:40,
vy:0,
gravity:0.7,
jump:-14
}

let obstacles=[]
let andando=false
let morreu=false
let pause=false
let score=0
let record=localStorage.getItem("record")||0
let audioLiberado=false

function liberarAudio(){
if(!audioLiberado){
let a=document.getElementById("som")
a.play().then(()=>{
a.pause()
a.currentTime=0
audioLiberado=true
})
}
}

function spawn(){
if(!morreu && !pause){
obstacles.push({
x:canvas.width,
y:canvas.height-50,
w:30,
h:40
})
}
}

setInterval(spawn,1800)

function update(){

if(morreu||pause)return

if(andando){
for(let o of obstacles)o.x-=6
}

player.vy+=player.gravity
player.y+=player.vy

if(player.y+player.h>canvas.height-10){
player.y=canvas.height-10-player.h
player.vy=0
}

for(let i=0;i<obstacles.length;i++){

let o=obstacles[i]

if(player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y){
morrer()
}

if(o.x+o.w<0){
obstacles.splice(i,1)
score++
}
}

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="cyan"
ctx.fillRect(player.x,player.y,player.w,player.h)

ctx.fillStyle="red"
for(let o of obstacles)
ctx.fillRect(o.x,o.y,o.w,o.h)

ctx.fillStyle="white"
ctx.fillText("Pontos:"+score,20,40)
ctx.fillText("Record:"+record,20,70)

}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

loop()

function pular(){
if(!morreu && player.vy==0){
liberarAudio()
player.vy=player.jump
}
}

andar.ontouchstart=()=>{
liberarAudio()
andando=true
}
andar.ontouchend=()=>andando=false

pular.ontouchstart=pular

pause.onclick=()=>pause=!pause

function morrer(){

morreu=true

if(score>record){
record=score
localStorage.setItem("record",record)
}

let a=document.getElementById("som")
a.currentTime=0
a.play()

morteTela.style.display="flex"

setTimeout(()=>{
voltar.style.display="block"
},2000)

}

voltar.onclick=()=>{
location.reload()
}

</script>
</body>
</html>
