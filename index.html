<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
*{margin:0;padding:0;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;}
body{background:#111;}
canvas{display:block;background:#222;width:100%;height:100%;}

#pular, #andar{
position:fixed;bottom:20px;width:90px;height:90px;font-size:40px;
border:none;border-radius:20px;background:#444;color:white;z-index:10;
}
#pular{left:20px;}
#andar{right:20px;}

#pause{
position:fixed;top:20px;right:20px;width:60px;height:60px;
font-size:30px;border:none;border-radius:15px;background:#444;color:white;z-index:10;
}

#btnVoltar{
position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
padding:20px 40px;font-size:20px;display:none;z-index:10;
background:#444;color:white;border:none;border-radius:15px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<button id="pular">⬆️</button>
<button id="andar">➡️</button>
<button id="pause">⏸️</button>
<button id="btnVoltar">Jogar Novamente</button>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault()); // desativa zoom

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

let player={x:100,y:0,w:50,h:50,vy:0,jump:false};
let obst=[];
let score=0;
let nivel=1;
let record=localStorage.getItem("record")||0;
let morto=false;
let pausado=false;

let musica=new Audio("musica.mp3");

let andarPressionado=false;

// REDIMENSIONAMENTO
function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
player.y=canvas.height-player.h-10;
obst.forEach(o=>o.y=canvas.height-50);
}
resize();
window.onresize=resize;

// OBSTÁCULOS
function spawn(){
if(!morto&&!pausado){
obst.push({x:canvas.width,y:canvas.height-50,w:50,h:50});
}
}
setInterval(spawn,1500);

// DESENHO
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle="red";
for(let i=0;i<obst.length;i++){
let o=obst[i];
ctx.fillRect(o.x,o.y,o.w,o.h);
o.x-=5+nivel;

if(o.x+o.w<0){obst.splice(i,1);score++;if(score%5===0)nivel++;}

if(player.x<o.x+o.w &&
   player.x+player.w>o.x &&
   player.y<o.y+o.h &&
   player.y+player.h>o.y){morrer();}
}

// Pontuação
ctx.fillStyle="white";
ctx.font="20px Arial";
ctx.fillText("Pontos: "+score,20,30);
ctx.fillText("Recorde: "+record,20,60);
}

// LOOP
function update(){
if(morto||pausado)return;

// ANDAR CONTÍNUO
if(andarPressionado){
player.x+=5;
if(player.x+player.w>canvas.width) player.x=canvas.width-player.w;
}

player.y+=player.vy;
player.vy+=1;

if(player.y+player.h>=canvas.height){
player.y=canvas.height-player.h;
player.jump=false;
}

draw();
requestAnimationFrame(update);
}
update();

// MOVIMENTOS
function pular(){if(!player.jump){player.vy=-20;player.jump=true;}}

// CELULAR
let pularBtn=document.getElementById("pular");
let andarBtn=document.getElementById("andar");

pularBtn.ontouchstart=pular;

andarBtn.ontouchstart=()=>{andarPressionado=true;}
andarBtn.ontouchend=()=>{andarPressionado=false;}

// PC
document.addEventListener("keydown", e=>{
if(e.code==="ArrowUp"||e.code==="Space") pular();
if(e.code==="ArrowRight"||e.key.toLowerCase()==="d") andarPressionado=true;
if(e.code==="KeyP"){pausado=!pausado;if(!pausado) update();}
});

document.addEventListener("keyup", e=>{
if(e.code==="ArrowRight"||e.key.toLowerCase()==="d") andarPressionado=false;
});

// MORTE
function morrer(){
if(!morto){
morto=true;
musica.currentTime=0;
musica.play();

let img=new Image();
img.src="morte.png";
img.onload=function(){
ctx.drawImage(img,canvas.width/2-100,canvas.height/2-100,200,200);
}

if(score>record){
record=score;
localStorage.setItem("record",record);
}

setTimeout(()=>{document.getElementById("btnVoltar").style.display="block";},2000);
}
}

// JOGAR NOVAMENTE
document.getElementById("btnVoltar").onclick=()=>{
musica.pause();
location.reload();
}

// PAUSA
document.getElementById("pause").onclick=()=>{
pausado=!pausado;
if(!pausado) update();
}
</script>
</body>
</html>
