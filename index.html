<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Runner Pro</title>

<style>
body{margin:0;overflow:hidden;background:#222}
canvas{display:block;background:#87CEEB}

#menu{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#111;display:flex;flex-wrap:wrap;
justify-content:center;align-items:center;z-index:10;
}

.fase{
width:60px;height:60px;margin:10px;
display:flex;justify-content:center;align-items:center;
color:#fff;font-size:20px;border-radius:10px;
}
.liberada{background:#2ecc71}
.travada{background:#555}

#controls{
position:fixed;bottom:10px;width:100%;
display:flex;justify-content:space-between;padding:0 20px;
}
.btn{
width:70px;height:70px;
background:#000000aa;color:white;
font-size:30px;text-align:center;
line-height:70px;border-radius:10px;
}

#gameOver{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#000000cc;display:none;
flex-direction:column;justify-content:center;
align-items:center;z-index:99;
}
#gameOver img{width:200px}
#restart{display:none;margin-top:20px;font-size:20px}
</style>
</head>

<body>

<div id="menu"></div>

<canvas id="game"></canvas>

<div id="controls">
<div class="btn" id="move">→</div>
<div class="btn" id="jump">↑</div>
</div>

<div id="gameOver">
<img src="morte.png">
<button id="restart">Jogar novamente</button>
</div>

<audio id="death" src="musica.mp3"></audio>

<script>
const c=document.getElementById("game")
const ctx=c.getContext("2d")
c.width=innerWidth
c.height=innerHeight

let fase=1
let move=false
let jump=false
let morto=false

let player={
x:100,
y:c.height-100,
w:40,h:40,
dy:0,
jump:false,
speed:4
}

let obs=[]

function spawn(){
obs.push({
x:c.width,
y:c.height-60,
w:40,
h:40
})
}

function morrer(){
if(morto)return
morto=true

let a=document.getElementById("death")
a.pause()
a.currentTime=0
a.play()

document.getElementById("gameOver").style.display="flex"
setTimeout(()=>{
document.getElementById("restart").style.display="block"
},2000)
}

function reset(){
player.y=c.height-100
player.dy=0
obs=[]
morto=false
let a=document.getElementById("death")
a.pause()
a.currentTime=0
document.getElementById("gameOver").style.display="none"
document.getElementById("restart").style.display="none"
loop()
}

function loop(){
ctx.clearRect(0,0,c.width,c.height)

ctx.fillStyle="green"
ctx.fillRect(0,c.height-20,c.width,20)

if(move&&!morto)player.x+=player.speed

if(jump&&!player.jump){
player.dy=-10
player.jump=true
}

player.dy+=0.5
player.y+=player.dy

if(player.y+player.h>=c.height-20){
player.y=c.height-20-player.h
player.jump=false
player.dy=0
}

ctx.fillStyle="red"
ctx.fillRect(player.x,player.y,player.w,player.h)

if(Math.random()<0.02+fase0.002)spawn()

obs.forEach(o=>{
o.x-=3+fase0.3
ctx.fillStyle="black"
ctx.fillRect(o.x,o.y,o.w,o.h)

if(
player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y
){
morrer()
}
})

if(!morto)requestAnimationFrame(loop)
}

document.getElementById("move").ontouchstart=()=>move=true
document.getElementById("move").ontouchend=()=>move=false
document.getElementById("jump").ontouchstart=()=>jump=true
document.getElementById("jump").ontouchend=()=>jump=false

addEventListener("keydown",e=>{
if(e.key=="ArrowRight")move=true
if(e.key=="ArrowUp")jump=true
})
addEventListener("keyup",e=>{
if(e.key=="ArrowRight")move=false
if(e.key=="ArrowUp")jump=false
})

document.getElementById("restart").onclick=()=>reset()

loop()
</script>

</body>
</html>
