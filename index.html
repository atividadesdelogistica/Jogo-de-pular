<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

*{
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

body{
margin:0;
overflow:hidden;
background:#111;
touch-action:none;
}

canvas{
display:block;
}

#controles{
position:fixed;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
z-index:2;
}

.btn{
width:70px;
height:70px;
background:#333;
color:white;
font-size:30px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
pointer-events:auto;
}

#menuMorte{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:3;
pointer-events:auto;
}

#voltar{
display:none;
padding:15px 30px;
font-size:20px;
margin-top:20px;
}

#imgMorte{
width:200px;
pointer-events:none;
}

</style>
</head>

<body oncontextmenu="return false">

<canvas id="game"></canvas>

<div id="controles">
<div class="btn" id="andar">➡️</div>
<div class="btn" id="pular">⬆️</div>
</div>

<div id="menuMorte">
<img id="imgMorte"
src="https://i.imgur.com/6RL1ZsR.png"
draggable="false">
<button id="voltar">Jogar de Novo</button>
</div>

<audio id="audio" src="musica.mp3"></audio>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault())
document.addEventListener("selectstart",e=>e.preventDefault())
document.addEventListener("dragstart",e=>e.preventDefault())

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=innerWidth
canvas.height=innerHeight

let andando=false
let morreu=false

let audio=document.getElementById("audio")

let player={
x:60,
y:canvas.height-120,
w:40,
h:40,
dy:0,
pulando:false
}

let obstaculos=[]

const gravidade=0.8
const forcaPulo=-17
let velocidade=5

function criarObstaculo(){
obstaculos.push({
x:canvas.width,
y:canvas.height-120,
w:40,
h:40
})
}

setInterval(()=>{
if(!morreu)criarObstaculo()
},1700)

function colisao(p,o){
return(
p.x<o.x+o.w &&
p.x+p.w>o.x &&
p.y<o.y+o.h &&
p.y+p.h>o.y
)
}

function desenharPlayer(){
ctx.fillStyle="#FFD800"
ctx.fillRect(player.x,player.y,40,40)
ctx.fillStyle="#000"
ctx.fillRect(player.x+10,player.y+10,5,5)
ctx.fillRect(player.x+25,player.y+10,5,5)
}

function desenharObstaculos(){
ctx.fillStyle="#ff4444"
obstaculos.forEach(o=>{
ctx.fillRect(o.x,o.y,40,40)
})
}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

// 🚫 NÃO SAIR DA ÁREA
if(andando && !morreu){
player.x+=velocidade
}

if(player.x<0)player.x=0
if(player.x>canvas.width-player.w)
player.x=canvas.width-player.w

player.dy+=gravidade
player.y+=player.dy

if(player.y>=canvas.height-120){
player.y=canvas.height-120
player.dy=0
player.pulando=false
}

obstaculos.forEach(o=>{
o.x-=velocidade
if(colisao(player,o)&&!morreu){
morrer()
}
})

desenharPlayer()
desenharObstaculos()

requestAnimationFrame(loop)
}

function morrer(){

morreu=true

audio.pause()
audio.currentTime=0
audio.play()

document.getElementById("menuMorte").style.display="flex"

setTimeout(()=>{
document.getElementById("voltar").style.display="block"
},2000)
}

document.getElementById("voltar").onclick=()=>{
audio.pause()
audio.currentTime=0
location.reload()
}

// ANDAR
document.getElementById("andar")
.addEventListener("touchstart",()=>{
andando=true
})

document.getElementById("andar")
.addEventListener("touchend",()=>{
andando=false
})

// PULAR
document.getElementById("pular")
.addEventListener("touchstart",()=>{
if(!player.pulando && !morreu){
player.dy=forcaPulo
player.pulando=true
}
})

// TECLADO
document.addEventListener("keydown",(e)=>{
if(e.key==="ArrowRight")andando=true

if(e.key==="ArrowUp" && !player.pulando && !morreu){
player.dy=forcaPulo
player.pulando=true
}
})

document.addEventListener("keyup",(e)=>{
if(e.key==="ArrowRight")andando=false
})

loop()

</script>
</body>
</html>
