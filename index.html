<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Runner Avançado</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background-color:#87ceeb;
  font-family:Arial, sans-serif;
}
canvas {
  display:block;
  margin:0 auto;
  background-color:#87ceeb;
}
#menu {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background-color: rgba(0,0,0,0.8);
  z-index:10;
}
#menu h1 {
  color:#fff;
  font-size:2em;
  margin-bottom:20px;
}
#menu button {
  padding:10px 20px;
  margin:5px;
  font-size:1em;
  cursor:pointer;
}
#fase {
  position:absolute;
  top:10px; left:10px;
  color:#fff;
  font-weight:bold;
  font-size:1.2em;
}
#gameOverImg {
  position:absolute;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  display:none;
  z-index:20;
  width:300px;
}
#touchControls {
  position:absolute;
  bottom:20px;
  left:50%;
  transform: translateX(-50%);
  display:flex;
  gap:20px;
  z-index:15;
  display:none;
}
#touchControls button {
  padding:20px;
  font-size:1.5em;
  border-radius:10px;
  opacity:0.7;
}
</style>
</head>
<body>

<div id="menu">
  <h1>Pixel Runner</h1>
  <button id="startBtn">Jogar</button>
</div>

<div id="fase">Fase: 1</div>
<img id="gameOverImg" src="gameover.png" alt="Game Over">

<audio id="audioHit" src="musica.mp3"></audio>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<!-- Controles Touch -->
<div id="touchControls">
  <button id="jumpBtn">↑</button>
  <button id="rightBtn">→</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioHit = document.getElementById('audioHit');
const gameOverImg = document.getElementById('gameOverImg');
const touchControls = document.getElementById('touchControls');

let gameRunning = false;
let fase = 1;
const totalFases = 20;
let obstacles = [];
let gameSpeed = 3;
let score = 0;

// Personagem
const player = {
  x:50,
  y:300,
  width:32,
  height:32,
  vy:0,
  gravity:0.8,
  jumpForce:-12,
  onGround:true,
  color:'#ffdd59',
  runFrame:0,
  speed:3
};

// Obstáculos
class Obstacle{
  constructor(x,y,width,height){
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
  }
  draw(){
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
}

// Menu
function startGame(){
  document.getElementById('menu').style.display='none';
  gameOverImg.style.display='none';
  gameRunning = true;
  fase = 1;
  score = 0;
  gameSpeed = 3;
  player.y = 300;
  player.vy = 0;
  player.x = 50;
  generateObstacles();

  // Detecta se é dispositivo touch
  if('ontouchstart' in window){
    touchControls.style.display='flex';
  } else {
    touchControls.style.display='none';
  }

  requestAnimationFrame(gameLoop);
}

// Reiniciar
function resetGame(){
  gameRunning=false;
  gameOverImg.style.display='block';
  audioHit.currentTime=0;
  audioHit.play();
  setTimeout(()=>{
    document.getElementById('menu').style.display='flex';
  },2500); // retorna ao menu depois de 2,5s
}

// Gerar obstáculos
function generateObstacles(){
  obstacles=[];
  let count=5+fase;
  for(let i=0;i<count;i++){
    let obsHeight = Math.random()*40+20;
    let obsWidth = 20+Math.random()*20;
    let obsX = 400 + i*150 + Math.random()*100;
    let obsY = 350 - obsHeight;
    obstacles.push(new Obstacle(obsX, obsY, obsWidth, obsHeight));
  }
}

// Controles teclado
document.addEventListener('keydown',(e)=>{
  if(!gameRunning) return;
  if(e.code==='Space'||e.code==='ArrowUp'){
    if(player.onGround){
      player.vy=player.jumpForce;
      player.onGround=false;
    }
  }
});

// Controles touch
document.getElementById('jumpBtn').addEventListener('touchstart',(e)=>{
  e.preventDefault();
  if(player.onGround){
    player.vy=player.jumpForce;
    player.onGround=false;
  }
});
document.getElementById('rightBtn').addEventListener('touchstart',(e)=>{
  e.preventDefault();
  player.x += player.speed;
  if(player.x+player.width>canvas.width) player.x=canvas.width-player.width;
});

// Loop do jogo
function gameLoop(){
  if(!gameRunning) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Fundo
  ctx.fillStyle='#87ceeb'; // céu
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#2ecc71'; // chão
  ctx.fillRect(0,350,canvas.width,50);

  // Player
  player.vy += player.gravity;
  player.y += player.vy;
  if(player.y+player.height>350){
    player.y = 350 - player.height;
    player.vy = 0;
    player.onGround = true;
  }

  // Animação corrida (muda cor levemente)
  player.runFrame += 0.2;
  const runColor = player.runFrame % 2 <1 ? '#ffdd59':'#ffd633';
  ctx.fillStyle = runColor;
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Obstáculos
  obstacles.forEach(obs=>{
    obs.x -= gameSpeed;
    obs.draw();

    // colisão
    if(player.x < obs.x + obs.width &&
       player.x + player.width > obs.x &&
       player.y < obs.y + obs.height &&
       player.y + player.height > obs.y){
        resetGame();
    }
  });

  // Pontuação e fase
  score++;
  if(score>800){
    if(fase<totalFases){
      fase++;
      gameSpeed+=0.5;
      generateObstacles();
      score=0;
    } else {
      alert('Parabéns! Você completou todas as fases!');
      resetGame();
    }
  }
  document.getElementById('fase').innerText = 'Fase: '+fase;

  requestAnimationFrame(gameLoop);
}

document.getElementById('startBtn').addEventListener('click',startGame);
</script>

</body>
</html>
