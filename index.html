<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Runner</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}

body{
background:black;
overflow:hidden;
touch-action:none;
}

canvas{
background:#111;
display:block;
}

#pauseBtn{
position:absolute;
top:15px;
right:15px;
z-index:10;
padding:10px 20px;
background:red;
color:white;
border:none;
font-size:18px;
}

#morteTela{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
display:none;
justify-content:center;
align-items:center;
background:black;
flex-direction:column;
z-index:20;
}

#morteTela img{
width:250px;
}
</style>
</head>

<body>

<button id="pauseBtn">⏸️</button>

<div id="morteTela">
<img src="morte.png">
<h1 style="color:white">VOCÊ MORREU</h1>
</div>

<audio id="audioMorte" src="musica.mp3"></audio>

<canvas id="game"></canvas>

<script>

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("touchstart", e => e.preventDefault(),{passive:false});
document.addEventListener("touchmove", e => e.preventDefault(),{passive:false});

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let player={
x:50,
y:200,
w:40,
h:40,
vy:0,
gravity:0.7,
jump:-13
}

let obstacles=[];
let score=0;
let gameOver=false;
let paused=false;

function spawnObstacle(){
obstacles.push({
x:canvas.width,
y:canvas.height-50,
w:40,
h:50
});
}

setInterval(()=>{
if(!gameOver && !paused){
spawnObstacle();
}
},1500);

function update(){

if(paused || gameOver) return;

player.vy+=player.gravity;
player.y+=player.vy;

if(player.y+player.h>canvas.height){
morrer();
}

for(let i=0;i<obstacles.length;i++){

let o=obstacles[i];
o.x-=6;

if(player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y){
morrer();
}

if(o.x+o.w<0){
obstacles.splice(i,1);
score++;
}
}

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="cyan";
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle="red";
for(let o of obstacles){
ctx.fillRect(o.x,o.y,o.w,o.h);
}

ctx.fillStyle="white";
ctx.font="25px Arial";
ctx.fillText("Pontos: "+score,20,40);
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loop();

function pular(){
if(!gameOver && !paused){
player.vy=player.jump;
}
}

canvas.addEventListener("touchstart",pular);
canvas.addEventListener("mousedown",pular);

function morrer(){

gameOver=true;

document.getElementById("morteTela").style.display="flex";

let audio=document.getElementById("audioMorte");
audio.currentTime=0;
audio.play();

}

document.getElementById("pauseBtn").onclick=()=>{
paused=!paused;
}

</script>
</body>
</html>
