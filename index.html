<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Pular Obstáculos</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #222;
    font-family: Arial, sans-serif;
  }

  #gameCanvas {
    display: block;
    background-color: #444;
    margin: 0 auto;
  }

  #menu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    text-align: center;
  }

  button {
    padding: 12px 20px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.3s;
  }

  #playBtn { background-color: #1f8ef1; color: #fff; }
  #playBtn:hover { background-color: #0f6edb; }

  #stopAudioBtn { background-color: #e74c3c; color: #fff; }
  #stopAudioBtn:hover { background-color: #c0392b; }

  #gameOverDiv {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #fff;
    z-index: 10;
  }

  #gameOverDiv img {
    width: 200px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Jogo de Pular Obstáculos</h1>
  <button id="playBtn">Jogar</button>
  <button id="stopAudioBtn">Parar Áudio</button>
</div>

<div id="gameOverDiv">
  <img src="gameover.png" alt="Game Over">
  <h2>Você perdeu!</h2>
  <button id="retryBtn">Jogar de Novo</button>
  <button id="exitBtn">Sair</button>
</div>

<canvas id="gameCanvas"></canvas>
<audio id="gameAudio" src="musica.mp3"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {x: 100, y: canvas.height - 150, width: 50, height: 50, dy: 0};
let gravity = 1;
let obstacles = [];
let frame = 0;
let level = 1;
let playing = false;
const totalLevels = 20;
let gameAudio = document.getElementById('gameAudio');

// Imagens
const playerImg = new Image();
playerImg.src = 'player.png'; // coloque a imagem do personagem
const obstacleImg = new Image();
obstacleImg.src = 'obstacle.png'; // coloque a imagem do obstáculo

// Botões
const playBtn = document.getElementById('playBtn');
const stopAudioBtn = document.getElementById('stopAudioBtn');
const gameOverDiv = document.getElementById('gameOverDiv');
const retryBtn = document.getElementById('retryBtn');
const exitBtn = document.getElementById('exitBtn');
const menuDiv = document.getElementById('menu');

function resetGame() {
  player.y = canvas.height - 150;
  player.dy = 0;
  obstacles = [];
  frame = 0;
  level = 1;
}

function startGame() {
  resetGame();
  menuDiv.style.display = 'none';
  gameOverDiv.style.display = 'none';
  playing = true;
  setTimeout(() => { gameLoop(); }, 2500); // delay de 2,5s
}

function endGame() {
  playing = false;
  gameAudio.play();
  gameOverDiv.style.display = 'flex';
}

function stopAudio() {
  gameAudio.pause();
  gameAudio.currentTime = 0;
}

// Eventos
playBtn.onclick = startGame;
stopAudioBtn.onclick = stopAudio;
retryBtn.onclick = startGame;
exitBtn.onclick = () => {
  gameOverDiv.style.display = 'none';
  menuDiv.style.display = 'block';
  stopAudio();
};

// Pular
function jump() {
  if(player.y >= canvas.height - 150){
    player.dy = -20;
  }
}

document.addEventListener('keydown', e => { if(e.code === 'Space') jump(); });
canvas.addEventListener('touchstart', jump);
canvas.addEventListener('mousedown', jump);

// Obstáculos
function createObstacle() {
  let width = 50 + Math.random() * 50;
  let x = canvas.width;
  let height = 50 + Math.random() * 50;
  obstacles.push({x, y: canvas.height - height, width, height});
}

// Loop do jogo
function gameLoop() {
  if(!playing) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  player.dy += gravity;
  player.y += player.dy;
  if(player.y > canvas.height - 150) player.y = canvas.height - 150;
  ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

  // Obstáculos
  frame++;
  if(frame % 90 === 0) createObstacle();
  obstacles.forEach((obs, i) => {
    obs.x -= 10 + level;
    ctx.drawImage(obstacleImg, obs.x, obs.y, obs.width, obs.height);

    // Colisão
    if(player.x < obs.x + obs.width && player.x + player.width > obs.x &&
       player.y < obs.y + obs.height && player.y + player.height > obs.y){
      endGame();
    }

    // Remover obstáculos
    if(obs.x + obs.width < 0) obstacles.splice(i,1);
  });

  // Score
  ctx.fillStyle = '#fff';
  ctx.font = '24px Arial';
  ctx.fillText(`Fase: ${level}`, 20, 40);

  // Passar de fase
  if(frame % 900 === 0 && level < totalLevels){
    level++;
  }

  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
