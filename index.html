<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Saltos - 20 Fases</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#222; overflow:hidden; }
  #menu, #game, #game-over { width:100%; max-width:900px; text-align:center; }
  h1 { color:#fff; margin-bottom:20px; }
  button { padding:10px 20px; margin:10px; font-weight:bold; border:none; border-radius:5px; cursor:pointer; transition:0.3s; }
  button:hover { opacity:0.8; }
  #game-container { position:relative; width:100%; height:500px; border-radius:10px; overflow:hidden; background: linear-gradient(to bottom, #4e54c8, #8f94fb); }
  canvas { display:block; width:100%; height:100%; background:transparent; }
  #game-over { color:#fff; display:none; position:relative; }
  #game-over img { max-width:100%; border-radius:10px; margin-bottom:20px; }
  .phase-btn { background:#ffcc00; color:#222; }
  .phase-btn.locked { background:#555; color:#999; cursor:not-allowed; }
</style>
</head>
<body>

<div id="menu">
  <h1>Jogo de Saltos</h1>
  <button onclick="startGame(1)">Jogar</button>
  <div id="phase-menu"></div>
</div>

<div id="game" style="display:none;">
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <button onclick="stopGame()">Sair</button>
</div>

<div id="game-over">
  <img src="gameover.png" alt="Game Over">
  <h1>Você errou!</h1>
  <button onclick="restartGame()">Jogar de novo</button>
  <button onclick="exitToMenu()">Menu</button>
</div>

<audio id="fail-audio" src="musica.mp3"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw, ch;
function resizeCanvas() {
  cw = canvas.width = canvas.clientWidth;
  ch = canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Variáveis do jogo
let player = {x:50, y:0, w:30, h:30, vy:0, jump:-14, color:'#ff3'};
let obstacles = [];
let currentPhase = 1;
let maxPhase = 1;
let gameLoopId;
let failAudio = document.getElementById('fail-audio');
let gameActive = false;
let speed = 5;

// Criar menu fases
const phaseMenu = document.getElementById('phase-menu');
function updatePhaseMenu(){
  phaseMenu.innerHTML = '';
  for(let i=1;i<=20;i++){
    let btn = document.createElement('button');
    btn.textContent = 'Fase '+i;
    btn.className = 'phase-btn';
    if(i>maxPhase) btn.classList.add('locked');
    else btn.onclick = ()=>startGame(i);
    phaseMenu.appendChild(btn);
  }
}
updatePhaseMenu();

// Funções do jogo
function startGame(phase){
  currentPhase = phase;
  document.getElementById('menu').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('game-over').style.display='none';
  resetGame();
  setTimeout(()=>{ gameActive = true; gameLoop(); }, 2500); // delay de 2,5s
  failAudio.pause();
  failAudio.currentTime = 0;
}

function resetGame(){
  player.y = ch - 60; player.vy = 0;
  obstacles = [];
  for(let i=0;i<6+currentPhase;i++){
    let w = 30+Math.random()*30;
    let h = 20+Math.random()*40;
    let x = cw + i*200 + Math.random()*100;
    let y = ch - h - Math.random()*50;
    obstacles.push({x,y,w,h});
  }
}

// Loop principal
function gameLoop(){
  if(!gameActive) return;
  ctx.clearRect(0,0,cw,ch);
  // chão
  ctx.fillStyle='#333';
  ctx.fillRect(0,ch-20,cw,20);
  // player
  ctx.fillStyle=player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // gravidade
  player.vy += 0.8;
  player.y += player.vy;
  if(player.y + player.h > ch-20){ player.y = ch-20 - player.h; player.vy=0; }
  // obstáculos
  ctx.fillStyle='#f33';
  for(let obs of obstacles){
    obs.x -= speed;
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    // colisão
    if(player.x < obs.x+obs.w && player.x+player.w>obs.x && player.y<obs.y+obs.h && player.y+player.h>obs.y){
      gameOver();
      return;
    }
  }
  // ganhar fase
  if(obstacles[obstacles.length-1].x + obstacles[obstacles.length-1].w < 0){
    nextPhase();
    return;
  }
  gameLoopId = requestAnimationFrame(gameLoop);
}

// pular
function jump(){ if(player.y + player.h >= ch-20) player.vy = player.jump; }
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); jump(); });

// próximo fase
function nextPhase(){
  gameActive=false;
  cancelAnimationFrame(gameLoopId);
  if(currentPhase<20) maxPhase = Math.max(maxPhase, currentPhase+1);
  startGame(currentPhase+1 <=20?currentPhase+1:20);
}

// game over
function gameOver(){
  gameActive=false;
  failAudio.play();
  cancelAnimationFrame(gameLoopId);
  document.getElementById('game-over').style.display='block';
}

// restart
function restartGame(){ startGame(currentPhase); }

// sair
function stopGame(){ gameActive=false; failAudio.pause(); failAudio.currentTime=0; document.getElementById('menu').style.display='block'; document.getElementById('game').style.display='none'; }
function exitToMenu(){ gameActive=false; failAudio.pause(); failAudio.currentTime=0; document.getElementById('menu').style.display='block'; document.getElementById('game').style.display='none'; document.getElementById('game-over').style.display='none'; updatePhaseMenu(); }
</script>
</body>
</html>
