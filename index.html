<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo Pular Obstáculos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; display: flex; justify-content: center; align-items: center; }
  #game-container { position: relative; width: 100%; height: 100%; max-width: 900px; max-height: 500px; background: linear-gradient(#4e54c8, #8f94fb); border-radius: 10px; overflow: hidden; }
  canvas { display: block; background: transparent; }
  .overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
  h1 { margin-bottom: 20px; font-size: 2.5em; text-align: center; }
  button { margin: 10px; padding: 12px 25px; font-size: 1.2em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, background 0.3s; }
  button:hover { transform: scale(1.05); }
  .start-btn { background-color: #4caf50; color: #fff; }
  .phase-btn { background-color: #2196f3; color: #fff; }
  .stop-sound-btn { background-color: #f44336; color: #fff; }
  #game-over img { max-width: 300px; margin-bottom: 20px; border-radius: 10px; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="900" height="500"></canvas>

  <!-- Menu Inicial -->
  <div id="menu" class="overlay">
    <h1>Jogo de Pular Obstáculos</h1>
    <button class="start-btn" onclick="startGame()">Jogar</button>
    <button class="stop-sound-btn" onclick="stopSound()">Parar Som</button>
  </div>

  <!-- Game Over -->
  <div id="game-over" class="overlay" style="display:none;">
    <h1>Você Errou!</h1>
    <img src="game-over.jpg" alt="Game Over">
    <button class="start-btn" onclick="restartGame()">Jogar Novamente</button>
    <button class="stop-sound-btn" onclick="stopSound()">Parar Som</button>
  </div>

  <!-- Seleção de Fases -->
  <div id="phase-select" class="overlay" style="display:none;">
    <h1>Selecione a Fase</h1>
    <div id="phase-buttons"></div>
    <button class="stop-sound-btn" onclick="stopSound()">Parar Som</button>
  </div>
</div>

<audio id="fail-audio" src="musica.mp3"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const failAudio = document.getElementById('fail-audio');

let player = { x: 50, y: 400, width: 50, height: 50, dy: 0, jump: -12 };
let obstacles = [];
let gravity = 0.5;
let gameSpeed = 5;
let phase = 1;
const totalPhases = 20;
let keys = {};
let animationFrameId;
let isGameOver = false;
let completedPhases = [true]; // desbloqueia a fase 1

// Eventos de teclado/touch
document.addEventListener('keydown', e => { if(e.code === 'Space') jump(); });
document.addEventListener('touchstart', jump);

// Menu de fases
function showPhaseSelect(){
  document.getElementById('menu').style.display = 'none';
  document.getElementById('phase-select').style.display = 'flex';
  const container = document.getElementById('phase-buttons');
  container.innerHTML = '';
  for(let i=1;i<=totalPhases;i++){
    const btn = document.createElement('button');
    btn.textContent = 'Fase ' + i;
    btn.className = 'phase-btn';
    btn.disabled = !completedPhases[i-1];
    btn.onclick = ()=> { phase=i; startGame(); };
    container.appendChild(btn);
  }
}

// Inicia o jogo
function startGame(){
  stopSound();
  document.getElementById('menu').style.display='none';
  document.getElementById('phase-select').style.display='none';
  isGameOver=false;
  resetPlayer();
  obstacles = [];
  spawnObstacles();
  animationFrameId = requestAnimationFrame(update);
}

// Reinicia o jogo após erro
function restartGame(){
  failAudio.pause();
  failAudio.currentTime = 0;
  startGame();
}

// Para o som
function stopSound(){
  failAudio.pause();
  failAudio.currentTime = 0;
}

// Reset player
function resetPlayer(){ player.y=400; player.dy=0; }

// Jump
function jump(){ if(player.y===400) player.dy=player.jump; }

// Criar obstáculos
function spawnObstacles(){
  obstacles = [];
  for(let i=0;i<phase+4;i++){
    const width = 30 + Math.random()*30;
    const height = 30 + Math.random()*50;
    const x = 900 + i*200 + Math.random()*100;
    obstacles.push({x,width,height});
  }
}

// Atualização do jogo
function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  player.dy += gravity;
  player.y += player.dy;
  if(player.y>400){ player.y=400; player.dy=0; }

  ctx.fillStyle = '#ffeb3b';
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // Obstacles
  ctx.fillStyle = '#f44336';
  for(let obs of obstacles){
    obs.x -= gameSpeed + phase*0.5;
    ctx.fillRect(obs.x, 400-obs.height, obs.width, obs.height);

    // Colisão
    if(player.x + player.width > obs.x && player.x < obs.x + obs.width &&
       player.y + player.height > 400-obs.height){
      gameOver();
      return;
    }
  }

  // Fim da fase
  if(obstacles[obstacles.length-1].x + obstacles[obstacles.length-1].width < 0){
    completedPhases[phase] = true;
    phase++;
    if(phase>totalPhases){ alert('Você terminou todas as fases!'); phase=totalPhases; showPhaseSelect(); return; }
    startGame();
    return;
  }

  animationFrameId = requestAnimationFrame(update);
}

// Game Over
function gameOver(){
  isGameOver=true;
  failAudio.play();
  cancelAnimationFrame(animationFrameId);
  document.getElementById('game-over').style.display='flex';
}

// Inicial
document.getElementById('menu').style.display='flex';
</script>
</body>
</html>
