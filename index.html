<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

*{
margin:0;
padding:0;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

body{
overflow:hidden;
background:black;
touch-action:none;
}

canvas{
background:#111;
display:block;
}

#controles{
position:fixed;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
z-index:10;
}

.btn{
width:80px;
height:80px;
background:rgba(255,255,255,0.2);
color:white;
font-size:30px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

#pause{
position:fixed;
top:20px;
right:20px;
background:red;
color:white;
padding:10px;
z-index:10;
}

#morteTela{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;
}

#morteTela img{
width:200px;
}

#voltar{
margin-top:20px;
padding:15px 25px;
font-size:20px;
display:none;
}

</style>
</head>
<body>

<button id="pause">⏸</button>

<div id="morteTela">
<img src="morte.png">
<button id="voltar">Jogar Novamente</button>
</div>

<canvas id="game"></canvas>

<div id="controles">
<div class="btn" id="andar">➡️</div>
<div class="btn" id="pular">⬆️</div>
</div>

<audio id="audio" src="musica.mp3" preload="auto"></audio>

<script>

document.addEventListener("contextmenu",e=>e.preventDefault());

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let audio = document.getElementById("audio");
let morteTela = document.getElementById("morteTela");
let voltar = document.getElementById("voltar");

let score=0;
let record = localStorage.getItem("record")||0;
let velocidade=4;
let morreu=false;

let player={
x:50,
y:canvas.height-100,
w:40,
h:40,
dy:0,
pulando:false
}

let obstaculos=[];
let andando=false;
let pausado=false;

function desenharPlayer(){
ctx.fillStyle="white";
ctx.fillRect(player.x,player.y,player.w,player.h);
}

function desenharObstaculos(){
ctx.fillStyle="red";
obstaculos.forEach(o=>{
ctx.fillRect(o.x,o.y,o.w,o.h);
})
}

function criarObstaculo(){
if(!morreu){
obstaculos.push({
x:canvas.width,
y:canvas.height-100,
w:40,
h:40,
passou:false
})
}
}

setInterval(criarObstaculo,2000);

function colisao(p,o){
return(
p.x<o.x+o.w &&
p.x+p.w>o.x &&
p.y<o.y+o.h &&
p.y+p.h>o.y
)
}

function morrer(){

if(morreu) return;

morreu=true;

morteTela.style.display="flex";

audio.currentTime=0;
audio.play();

setTimeout(()=>{
voltar.style.display="block";
},2000);

if(score>record){
localStorage.setItem("record",score);
}

}

function update(){

if(pausado || morreu) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

if(andando){
player.x+=5;
}

player.dy+=0.6;
player.y+=player.dy;

if(player.y>canvas.height-100){
player.y=canvas.height-100;
player.pulando=false;
}

obstaculos.forEach(o=>{
o.x-=velocidade;

if(!o.passou && o.x+o.w<player.x){
score++;
o.passou=true;

if(score%5==0){
velocidade+=1;
}
}

if(colisao(player,o)){
morrer();
}
})

desenharPlayer();
desenharObstaculos();

requestAnimationFrame(update);
}

update();

let andarBtn = document.getElementById("andar");
let pularBtn = document.getElementById("pular");

andarBtn.addEventListener("touchstart",(e)=>{
e.stopPropagation();
andando=true;
})

andarBtn.addEventListener("touchend",(e)=>{
e.stopPropagation();
andando=false;
})

pularBtn.addEventListener("touchstart",(e)=>{
e.stopPropagation();
if(!player.pulando){
player.dy=-13;
player.pulando=true;
}
})

voltar.addEventListener("touchstart",()=>{
audio.pause();
audio.currentTime=0;
location.reload();
})

document.getElementById("pause").addEventListener("touchstart",()=>{
pausado=!pausado;
})

</script>
</body>
</html>
