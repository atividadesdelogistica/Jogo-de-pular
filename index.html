<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>

*{
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}

body{
margin:0;
overflow:hidden;
background:#111;
}

canvas{
display:block;
background:#87CEEB;
}

.btn{
position:fixed;
bottom:25px;
width:70px;
height:70px;
background:#000a;
color:white;
font-size:35px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
}

#jump{left:20px}
#right{right:20px}

#gameOver{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000c;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
}

#retry{
display:none;
margin-top:20px;
padding:15px 30px;
font-size:20px;
}

img{
pointer-events:none;
}

</style>
</head>

<body oncontextmenu="return false">

<canvas id="game"></canvas>

<div id="jump" class="btn">⬆️</div>
<div id="right" class="btn">➡️</div>

<div id="gameOver">
<img src="morte.png" width="200" draggable="false">
<button id="retry">Jogar novamente</button>
</div>

<audio id="som" src="musica.mp3"></audio>

<script>

window.onload=function(){

document.addEventListener("copy",e=>e.preventDefault())

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let ground=canvas.height-100

let player={
x:100,
y:ground-40,
w:40,
h:40,
dy:0
}

let andando=false
let pulando=false
let morreu=false

let gravidade=0.9
let pulo=-18

let obstaculos=[]
let velocidade=5
let intervalo=1500

const som=document.getElementById("som")

function criarObs(){

obstaculos.push({
x:canvas.width,
y:ground-40,
w:40,
h:40
})

}

function spawn(){

if(morreu)return

criarObs()

setTimeout(spawn,intervalo)

}

spawn()

function morrer(){

if(morreu)return

morreu=true

som.pause()
som.currentTime=0
som.play()

gameOver.style.display="flex"

setTimeout(()=>{
retry.style.display="block"
},2000)

}

retry.onclick=()=>{

som.pause()
som.currentTime=0

morreu=false
obstaculos=[]

player.x=100
player.y=ground-player.h

gameOver.style.display="none"
retry.style.display="none"

spawn()

}

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

if(andando && !morreu){
player.x+=velocidade
}

player.dy+=gravidade
player.y+=player.dy

if(player.y>ground-player.h){
player.y=ground-player.h
player.dy=0
pulando=false
}

ctx.fillStyle="yellow"
ctx.fillRect(player.x,player.y,player.w,player.h)

obstaculos.forEach(o=>{

o.x-=velocidade

ctx.fillStyle="red"
ctx.fillRect(o.x,o.y,o.w,o.h)

if(
player.x<o.x+o.w &&
player.x+player.w>o.x &&
player.y<o.y+o.h &&
player.y+player.h>o.y &&
!morreu
){
morrer()
}

})

requestAnimationFrame(loop)
}

loop()

right.ontouchstart=()=>andando=true
right.ontouchend=()=>andando=false

jump.ontouchstart=()=>{
if(!pulando){
player.dy=pulo
pulando=true
}
}

onkeydown=e=>{
if(e.key=="ArrowRight")andando=true
if(e.key=="ArrowUp"){
if(!pulando){
player.dy=pulo
pulando=true
}
}
}

onkeyup=e=>{
if(e.key=="ArrowRight")andando=false
}

}

</script>
</body>
</html>
