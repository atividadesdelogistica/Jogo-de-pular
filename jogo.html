<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo de Pular Blocos</title>
<style>
  body, html {
    margin: 0; padding: 0; height: 100%; background: #87ceeb; display: flex; justify-content: center; align-items: center; font-family: sans-serif;
  }
  #game-container {
    position: relative; width: 400px; height: 400px; background: #f0f0f0; overflow: hidden; border: 3px solid #333; border-radius: 10px;
  }
  .player {
    position: absolute; bottom: 0; left: 50px; width: 40px; height: 40px; background: #ff0000; border-radius: 5px;
    transition: bottom 0.2s;
  }
  .obstacle {
    position: absolute; bottom: 0; width: 40px; height: 40px; background: #000; right: -40px;
  }
  #gameover-screen {
    display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); color:#fff; text-align:center;
  }
  #gameover-screen img { max-width: 80%; margin-top: 30px; }
  button { padding:10px 15px; margin-top:15px; font-weight:bold; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<div id="game-container">
  <div class="player" id="player"></div>
  <div id="gameover-screen">
    <h1>Game Over!</h1>
    <img src="gameover.png" alt="Game Over">
    <div>
      <button onclick="restartGame()">Jogar de Novo</button>
      <button onclick="stopAudio()">Parar Som</button>
    </div>
  </div>
</div>

<audio id="game-audio" src="musica.mp3"></audio>

<script>
const player = document.getElementById('player');
const container = document.getElementById('game-container');
const gameOverScreen = document.getElementById('gameover-screen');
const audio = document.getElementById('game-audio');

let jumping = false;
let obstacles = [];
let gameInterval;
let speed = 3;

function jump() {
  if (jumping) return;
  jumping = true;
  let bottom = 0;
  let up = setInterval(() => {
    if (bottom >= 100) {
      clearInterval(up);
      let down = setInterval(() => {
        if (bottom <= 0) {
          clearInterval(down);
          jumping = false;
        }
        bottom -= 5;
        player.style.bottom = bottom + 'px';
      }, 20);
    }
    bottom += 5;
    player.style.bottom = bottom + 'px';
  }, 20);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') jump();
});
document.addEventListener('touchstart', jump);

function createObstacle() {
  let obs = document.createElement('div');
  obs.classList.add('obstacle');
  container.appendChild(obs);
  let right = -40;
  let move = setInterval(() => {
    right += speed;
    obs.style.right = right + 'px';
    
    // colisão
    let playerRect = player.getBoundingClientRect();
    let obsRect = obs.getBoundingClientRect();
    if (!(playerRect.top > obsRect.bottom || playerRect.bottom < obsRect.top || playerRect.right < obsRect.left || playerRect.left > obsRect.right)) {
      gameOver();
    }
    
    if (right > 400) {
      clearInterval(move);
      obs.remove();
    }
  }, 20);
  obstacles.push(obs);
}

function gameOver() {
  clearInterval(gameInterval);
  obstacles.forEach(o => o.remove());
  obstacles = [];
  gameOverScreen.style.display = 'block';
  audio.play();
}

function restartGame() {
  gameOverScreen.style.display = 'none';
  speed = 3;
  gameInterval = setInterval(() => {
    createObstacle();
    speed += 0.05; // fica mais difícil
  }, 2000);
}

function stopAudio() {
  audio.pause();
  audio.currentTime = 0;
}

// inicia jogo automaticamente
restartGame();
</script>

</body>
</html>
